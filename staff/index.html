const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function open_(pw,quiet){const go=document.getElementById('go'),msg=document.getElementById('msg');go.disabled=true;msg.textContent='';
  try{const key=await mkKey(pw.trim());window.__PK=key;const d=b64(DATA);const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12));
    const page=document.getElementById('page');page.innerHTML=new TextDecoder().decode(buf);
    document.getElementById('gate').remove();page.hidden=false;document.title=TITLE;
    for(const old of page.querySelectorAll('script')){const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s)}
    try{sessionStorage.setItem('k'+location.pathname,pw.trim())}catch(e){}
    window.scrollTo(0,0);
  }catch(e){if(!quiet)msg.textContent='合言葉が違うようです。もう一度お試しください。';try{sessionStorage.removeItem('k'+location.pathname)}catch(_){}
    go.disabled=false}}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();open_(document.getElementById('pw').value)});
(function(){const m=location.hash.match(/[#&]k=([A-Za-z0-9]+)/);
  if(m){history.replaceState(null,'',location.pathname+location.search);open_(m[1],false);return}
  try{const k=sessionStorage.getItem('k'+location.pathname);if(k)open_(k,true)}catch(e){}})();
